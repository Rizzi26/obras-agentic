<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Canteiro · agente de obras (protótipo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf9f5; --card:#fff; --cream:#f5f4ee; --cream2:#efede5;
  --ink:#1f1e1d; --ink2:#3d3c39; --muted:#75736c; --faint:#a29f96; --line:#e6e3d9; --line2:#efede6;
  --side:#f3f1ea; --sideHover:#ebe8df; --sideOn:#e6e2d7;
  --accent:#c6613f; --accentHi:#d97757; --accentSoft:#f9eee8; --accentInk:#a14d30;
  --green:#5b8364; --greenSoft:#ebf1ea; --red:#b5513f; --redSoft:#f8ebe6;
  --amber:#b8862f; --amberSoft:#f7f0df; --blue:#5b7a99; --blueSoft:#ebf0f4; --violet:#8a7ca8;
  --serif:"Newsreader","Source Serif 4",Georgia,"Times New Roman",serif;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --r:12px;
}
*{box-sizing:border-box} html,body{margin:0;height:100%}
body{font:14px/1.55 var(--sans);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit} a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accentHi);outline-offset:2px;border-radius:6px}
b{font-weight:600}
.ic{flex:none;vertical-align:-3px}
h1,h2{font-family:var(--serif);font-weight:500;letter-spacing:-.01em}
.app{display:grid;grid-template-columns:264px 1fr;height:100vh}
/* sidebar */
.side{background:var(--side);border-right:1px solid var(--line);color:var(--ink2);display:flex;flex-direction:column;padding:18px 12px 12px;gap:1px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:500;font-size:20px;color:var(--ink);padding:2px 10px 14px}
.brand .tag{font-family:var(--sans);font-size:10.5px;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:1px 7px;letter-spacing:.02em}
.logo{width:26px;height:26px;display:grid;place-items:center;color:var(--accent);flex:none}
.side .sec{font-size:12px;color:var(--faint);padding:18px 10px 6px;font-weight:500}
.nav{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;color:var(--ink2);font-size:13.5px}
.nav .ic{color:var(--muted)}
.nav:hover{background:var(--sideHover)} .nav.on{background:var(--sideOn);color:var(--ink);font-weight:500} .nav.on .ic{color:var(--ink)}
.nav .dot{width:7px;height:7px;border-radius:50%;flex:none;margin:0 4px}
.nav small{margin-left:auto;color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums}
.nav .count{margin-left:auto;background:var(--accentSoft);color:var(--accentInk);font-size:11.5px;font-weight:600;padding:0 7px;border-radius:99px}
.newbtn{margin:4px 0;padding:7px 10px;border:0;border-radius:8px;color:var(--muted);background:none;text-align:left;display:flex;align-items:center;gap:10px;font-size:13.5px}
.newbtn:hover{background:var(--sideHover);color:var(--ink)}
.side .foot{margin-top:auto;padding:12px 10px 4px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;font-size:13px;line-height:1.35}
.av{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:11.5px;font-weight:600;flex:none}
.fict{display:flex;gap:8px;margin:0 2px 12px;padding:9px 10px;border-radius:9px;background:var(--amberSoft);color:#7a5a1e;font-size:11.5px;line-height:1.45}
.fict .ic{margin-top:1px;color:var(--amber)}
.toggle{margin-left:auto;width:26px;height:15px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .15s}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:#fff;transition:transform .15s}
.notes .toggle{background:var(--accent)} .notes .toggle::after{transform:translateX(11px)}
/* main */
.main{overflow:auto;display:flex;flex-direction:column}
.top{flex:none;display:flex;align-items:center;gap:14px;padding:30px 44px 0}
.top h1{font-size:30px;line-height:1.15;margin:0}
.crumb{color:var(--muted);font-size:13px} .crumb a:hover{color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:500;white-space:nowrap;line-height:1.6}
.pill .ic{vertical-align:0}
.ok{background:var(--greenSoft);color:#45684d} .warn{background:var(--amberSoft);color:#86621f} .bad{background:var(--redSoft);color:#9a4334} .info{background:var(--blueSoft);color:#46617c} .gray{background:var(--cream2);color:var(--muted)}
.tabs{flex:none;display:flex;gap:4px;padding:18px 44px 0;border-bottom:1px solid var(--line);overflow:auto}
.tab{display:inline-flex;align-items:center;gap:7px;padding:9px 10px 11px;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;font-size:13.5px}
.tab .ic{opacity:.8}
.tab:hover{color:var(--ink)} .tab.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:500}
.page{padding:28px 44px 56px;flex:1}
.grid{display:grid;gap:18px} .g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px}
.card h3{margin:0 0 14px;font:500 18px/1.3 var(--serif);letter-spacing:-.005em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 small{color:var(--muted);font:400 13px var(--sans)}
.card h3 .ic{color:var(--accent)}
.kpi{padding:18px 20px} .kpi .l{color:var(--muted);font-size:12.5px} .kpi .v{font:400 30px/1.15 var(--serif);margin-top:6px;letter-spacing:-.01em;font-variant-numeric:lining-nums}
.kpi .s{font-size:12.5px;margin-top:4px;display:flex;align-items:center;gap:4px}
.bar{height:6px;background:var(--cream2);border-radius:99px;overflow:hidden} .bar i{display:block;height:100%;background:var(--accentHi);border-radius:99px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:500;padding:9px 12px;border-bottom:1px solid var(--line)}
td{padding:11px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
tr:last-child td{border-bottom:0}
table.sm td{padding:8px 12px} table.sm th{padding:7px 12px}
.agentnote table.sm td{padding:7px 0;border-color:#efdcd0}
tr.click:hover td{background:#fcfbf8;cursor:pointer}
.card[style*="padding:0"] th:first-child,.card[style*="padding:0"] td:first-child{padding-left:20px}
.card[style*="padding:0"] th:last-child,.card[style*="padding:0"] td:last-child{padding-right:20px}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:13.5px;line-height:1.4;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--cream);border-color:#d8d4c8}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.amb{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500} .btn.amb:hover{background:var(--accentInk);border-color:var(--accentInk)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.iconbtn{padding:6px;border:0;background:none;border-radius:8px;color:var(--muted)} .iconbtn:hover{background:var(--cream2);color:var(--ink)}
.row{display:flex;align-items:center;gap:10px} .sp{flex:1} .mut{color:var(--muted)} .sm{font-size:12.5px}
.sectit{font:500 18px var(--serif)}
/* chat */
.chatwrap{display:grid;grid-template-columns:248px 1fr;flex:1;min-height:0}
.sessions{border-right:1px solid var(--line);padding:18px 12px;overflow:auto}
.sess{padding:8px 10px;border-radius:8px;margin-bottom:2px;cursor:default} .sess:hover{background:var(--cream)} .sess.on{background:var(--cream2)}
.sess b{display:block;font-size:13.5px;font-weight:500} .sess span{font-size:12px;color:var(--muted)}
.chat{display:flex;flex-direction:column;min-height:0}
.msgs{flex:1;overflow:auto;padding:28px max(28px,calc((100% - 760px)/2)) 12px;display:flex;flex-direction:column;gap:28px}
.msgs > .callout{margin-bottom:0}
.msg{max-width:760px;width:100%}
.msg.me{align-self:flex-end;width:auto;max-width:560px;background:var(--cream2);color:var(--ink);padding:11px 16px;border-radius:18px;line-height:1.5}
.msg.ai{display:flex;gap:14px;line-height:1.65;color:var(--ink2)}
.msg.ai .bub{flex:1;min-width:0}
.msg.ai .bub b{color:var(--ink)}
.msg.ai table{margin:10px 0;background:#fff;border:1px solid var(--line);border-radius:10px;border-collapse:separate;border-spacing:0;overflow:hidden}
.aiav{width:26px;height:26px;display:grid;place-items:center;color:var(--accent);flex:none;margin-top:1px}
.tools{font-size:12px;color:var(--faint);margin-bottom:8px;display:flex;flex-wrap:wrap;gap:4px 14px}
.tools span{display:inline-flex;align-items:center;gap:5px}
.tools .ic{vertical-align:0}
.note{display:flex;gap:8px;align-items:flex-start;margin:4px 0}
.note .ic{margin-top:4px}
.composer{margin:8px auto 22px;width:calc(100% - 56px);max-width:760px;border:1px solid var(--line);background:#fff;border-radius:18px;padding:12px 14px 10px;box-shadow:0 1px 2px rgba(31,30,29,.04),0 4px 18px rgba(31,30,29,.04)}
.composer:focus-within{border-color:#d4cfc2}
.composer textarea{width:100%;border:0;outline:0;resize:none;font:15px/1.5 var(--sans);min-height:48px;background:none;color:var(--ink);padding:4px 2px}
.composer textarea::placeholder{color:var(--faint)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 auto 4px;width:calc(100% - 56px);max-width:760px}
.chip{border:1px solid var(--line);background:transparent;padding:5px 12px;border-radius:99px;font-size:12.5px;color:var(--muted)}
.chip:hover{background:#fff;color:var(--ink)}
.attach{display:inline-flex;gap:6px;align-items:center;background:var(--cream);border:1px solid var(--line2);padding:3px 10px;border-radius:8px;font-size:12.5px;margin:0 4px 6px 0;color:var(--ink2)}
.attach .ic{color:var(--muted);vertical-align:0}
.msg.me .attach{background:#fff}
/* kanban */
.kb{display:grid;grid-auto-flow:column;grid-auto-columns:256px;gap:14px;overflow:auto;padding-bottom:12px}
.col{background:var(--cream);border-radius:12px;padding:12px;min-height:300px}
.col h4{margin:2px 4px 12px;font-size:13px;font-weight:600;display:flex;gap:6px;align-items:center} .col h4 small{color:var(--muted);font-weight:400;margin-left:auto;font-size:12px}
.kc{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:8px;font-size:13px;position:relative}
.kc[draggable="true"]{cursor:grab}
.kc b{display:block;margin-bottom:3px;font-weight:500} .kc .meta b{white-space:nowrap;flex:none} .kc .meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:12px;margin-top:8px}
.kc.late{box-shadow:inset 2px 0 0 var(--red)} .kc.done{opacity:.85}
/* misc */
.callout{display:flex;gap:9px;align-items:flex-start;border:1px solid #ecdcc4;background:#fcf7ee;border-radius:10px;padding:11px 14px;font-size:13px;line-height:1.5;margin-bottom:20px;color:var(--ink2)}
.callout .ic{color:var(--amber);margin-top:2px}
.callout b{color:#86621f;font-weight:600}
body:not(.notes) .callout.val{display:none}
.agentnote{background:var(--accentSoft)!important;border-color:#efd6c9!important}
.agentnote h3 .ic,.agentnote > .ic{color:var(--accent)}
.alertnote{background:var(--redSoft)!important;border-color:#efd3cb!important}
.alertnote > .ic{color:var(--red)}
.inline{display:flex;gap:9px;align-items:flex-start}
.inline > .ic{margin-top:2px}
.drawer{position:fixed;inset:0;background:rgba(31,30,29,.22);display:none;justify-content:flex-end;z-index:20}
.drawer.on{display:flex} .drawer .pane{width:580px;max-width:95vw;background:var(--bg);height:100%;overflow:auto;padding:24px 30px;border-left:1px solid var(--line);box-shadow:-20px 0 50px rgba(31,30,29,.08)}
.drawer h2{font-size:26px;line-height:1.2}
.modal{position:fixed;inset:0;background:rgba(31,30,29,.26);display:none;place-items:center;z-index:30}
.modal.on{display:grid} .modal .box{width:640px;max-width:95vw;max-height:90vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px 30px;box-shadow:0 24px 70px rgba(31,30,29,.14)}
.modal h2{font-size:25px;line-height:1.2;display:flex;align-items:center;gap:10px}
.modal h2 .ic{color:var(--accent)}
.steps{display:flex;gap:6px;margin-bottom:22px} .steps div{flex:1;height:3px;border-radius:99px;background:var(--cream2)} .steps div.on{background:var(--accent)}
input.f,select.f,textarea.f{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:9px;font:inherit;background:#fff;color:var(--ink)}
input.f:focus,select.f:focus,textarea.f:focus{outline:0;border-color:var(--accentHi);box-shadow:0 0 0 3px var(--accentSoft)}
textarea.f{line-height:1.6}
label.l{display:block;font-size:12.5px;color:var(--muted);margin:14px 0 5px;font-weight:500}
.drop{border:1.5px dashed #d9d5c9;border-radius:14px;padding:26px;text-align:center;color:var(--muted);background:var(--bg)}
.drop .ic{color:var(--faint);display:block;margin:0 auto 8px}
.gantt{display:grid;grid-template-columns:170px 1fr;gap:10px 14px;align-items:center;font-size:13px}
.gtrack{position:relative;height:24px;background:var(--bg);border-radius:6px}
.gb{position:absolute;top:3px;height:16px;border-radius:99px}
.today{position:absolute;top:-6px;bottom:-6px;width:1.5px;background:var(--accent)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;display:none;z-index:40;font-size:13.5px;box-shadow:0 10px 30px rgba(31,30,29,.18)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted)} .legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.wscard{cursor:pointer;transition:border-color .12s,box-shadow .12s} .wscard:hover{border-color:#d8d4c8;box-shadow:0 2px 14px rgba(31,30,29,.05)}
.wscard .name{font:500 19px/1.25 var(--serif)}
.split{height:10px;border-radius:99px;overflow:hidden;display:flex;gap:2px;background:var(--cream2)}
.link{color:var(--accentInk);display:inline-flex;align-items:center;gap:5px;font-size:13px}
.link:hover{text-decoration:underline}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}*{transition:none!important}}
/* Abaixo de 1100 px o layout de painel quebra (sidebar + 4 colunas de KPI): em vez de uma
   versão capenga, a página inteira dá lugar ao aviso — nada do protótipo fica acessível. */
#gate{display:none}
@media (max-width:1099px){
  .app,.drawer,.modal,.toast{display:none!important}
  #gate{display:grid;position:fixed;inset:0;place-items:center;background:var(--bg);color:var(--ink);padding:32px;z-index:100;text-align:center}
  #gate .box{max-width:380px}
  #gate h2{font-size:30px;margin:0}
  #gate p{color:var(--muted);margin:12px 0 0;line-height:1.6}
  #gate .logo{margin:0 auto 22px;width:52px;height:52px;border-radius:14px;background:var(--accentSoft)}
  #gate .meta{margin-top:24px;padding-top:16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--faint)}
}
</style>
</head>
<body class="notes">
<div id="gate"><div class="box"><div class="logo"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6 5.6 18.4"/></svg></div>
  <h2>Abra num computador</h2>
  <p>Este protótipo foi desenhado para telas de computador e não funciona em celular ou tablet.</p>
  <p>Se você já está num computador, maximize a janela do navegador.</p>
  <p class="meta">Sua tela: <span id="gw"></span> px de largura · mínimo: 1100 px</p>
</div></div>
<div class="app">
  <aside class="side" id="side"></aside>
  <main class="main" id="main"></main>
</div>
<div class="drawer" id="drawer" onclick="if(event.target===this)closeDrawer()"><div class="pane" id="drawerPane"></div></div>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="box" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

/* ===================== ESTADO / ROTAS ===================== */
let state = {view:'home', obra:null, tab:'chat'};
function go(view, obra, tab){ state={view, obra:obra||null, tab:tab||'chat'}; location.hash = [view,obra,tab].filter(Boolean).join('/'); render(); }
window.onhashchange = () => { const [v,o,t]=location.hash.slice(1).split('/'); if(v){state={view:v,obra:o||null,tab:t||'chat'}; render();} };
const $ = id => document.getElementById(id);
function toast(t){ const e=$('toast'); e.textContent=t; e.style.display='block'; clearTimeout(e._t); e._t=setTimeout(()=>e.style.display='none',2600); }
function obra(){ return OBRAS.find(o=>o.id===state.obra); }
function val(texto){ return `<div class="callout val">${icon('flask')}<div><b>Validar com o gerente de obra:</b> ${texto}</div></div>`; }

  return `<div class="top"><h1>Estoque entre obras</h1><span class="crumb">o que sobra numa obra e falta em outra · sempre a preço de custo</span></div>
  <div class="page">
    ${val('Ele já faz isso hoje, "no braço", entre obras? Quem autoriza a saída da obra de origem: o mestre dela, o gerente ou o dono? O preço de custo é justo, ou precisa somar frete e manuseio? E quando as obras são de clientes diferentes (o material é do cliente), ainda pode?')}
    <div class="grid g4" style="margin-bottom:18px">
      <div class="card kpi"><div class="l">Sugestões do agente</div><div class="v">${TRANSF.length}</div><div class="s mut">entre 2 obras</div></div>
      <div class="card kpi"><div class="l">Economia vs. comprar novo</div><div class="v" style="color:var(--green)">${brl2(eco)}</div><div class="s mut">diferença de preço, sem contar o frete</div></div>
      <div class="card kpi"><div class="l">Material que deixaria de estragar</div><div class="v" style="color:var(--green)">${brl2(perda)}</div><div class="s mut">cimento vencendo na Loja Centro</div></div>
      <div class="card kpi"><div class="l">Dias de obra ganhos</div><div class="v" style="color:var(--green)">até 3</div><div class="s mut">chega hoje, não em 3 dias</div></div>
    </div>
    <div class="card" style="margin-bottom:18px"><h3>${icon('spark',17)}Transferências sugeridas</h3>
      <div class="sm mut" style="margin:-6px 0 12px">Regra: a obra de origem fica com o que ainda vai usar <b>+ uma reserva de metade disso</b>. Só o que passar disso pode sair.</div>
      <table><tr><th>Item</th><th>De → para</th><th class="num">Saldo na origem</th><th class="num">Origem ainda usa</th><th class="num">Reserva</th><th class="num">Pode sair</th><th class="num">Destino precisa</th><th class="num">Preço de custo</th><th class="num">Total</th><th></th></tr>
      ${TRANSF.map((t,k)=>`<tr><td><b>${t.item}</b>${t.perda?`<div class="sm row" style="gap:5px;color:var(--amber)">${icon('hourglass',13)}vence em 25 dias na origem</div>`:''}</td>
        <td class="sm">${NOME_OBRA[t.origem]}<br><span class="mut">→</span> <b>${NOME_OBRA[t.destino]}</b></td>
        <td class="num">${t.saldo}</td><td class="num">${t.usar}</td><td class="num">${t.reserva}</td><td class="num"><b>${t.max}</b></td><td class="num">${t.falta}</td>
        <td class="num">${brl2(t.custo)}<div class="sm mut">novo: ${brl2(t.novo)}</div></td><td class="num"><b>${brl2(t.sug*t.custo)}</b><div class="sm mut">${t.sug} ${t.un}</div></td>
        <td><button class="btn amb sm" onclick="openTransfer(${k})">Transferir</button></td></tr>`).join('')}</table></div>
    <div class="grid" style="grid-template-columns:1.6fr 1fr">
      <div class="card"><h3>Histórico</h3><table class="sm"><tr><th>Nº</th><th>Data</th><th>Item</th><th>De → para</th><th class="num">Valor (custo)</th><th>Situação</th></tr>
        ${TRF_HIST.map(h=>`<tr><td class="mut">${h.id}</td><td>${h.d}</td><td>${h.item} · ${h.q}</td><td>${NOME_OBRA[h.de]} → ${NOME_OBRA[h.para]}</td><td class="num">${brl2(h.v)}</td><td><span class="pill ${h.st==='Recebida'?'ok':'warn'}">${h.st}</span></td></tr>`).join('')}</table></div>
      <div class="card"><h3>Acerto entre as obras <small>· o budget de cada uma</small></h3>
        <div class="sm mut" style="margin-bottom:10px">Quem cede recebe o valor de volta no orçamento; quem recebe lança como gasto de material.</div>
        ${['vila-nova','loja-centro'].map(id=>{const v=saldoObra(id); return `<div class="row" style="margin:10px 0;padding-bottom:10px;border-bottom:1px solid var(--line2)"><span>${NOME_OBRA[id]}</span><span class="sp"></span><b style="font:500 18px var(--serif);color:${v>=0?'var(--green)':'var(--red)'}">${v>=0?'+':'−'}${brl2(Math.abs(v))}</b></div>`}).join('')}
        <div class="sm mut">Positivo: cedeu mais do que recebeu.</div></div>
    </div>
  </div>`;
}
function openTransfer(k){
  closeDrawer();
  const t=TRANSF[k];
  const w=x=>x/t.saldo*100;
  $('modalBox').innerHTML = `<h2 style="margin:0 0 6px">${icon('swap',20)}Transferir entre obras</h2>
    <div class="mut sm">${NOME_OBRA[t.origem]} → <b style="color:var(--ink)">${NOME_OBRA[t.destino]}</b> · ${t.item}</div>
    <div class="card agentnote inline" style="margin:18px 0;font-size:13px;padding:14px 16px">${icon('spark',15)}<div>${t.pq}</div></div>
    <b class="sm">Quanto pode sair sem prejudicar a ${NOME_OBRA[t.origem]}</b>
    <div class="split" style="height:20px;margin:10px 0;border-radius:6px"><div style="width:${w(t.usar)}%;background:#a8a497" title="ainda vai usar"></div><div style="width:${w(t.reserva)}%;background:#d6d2c5" title="reserva"></div><div style="width:${w(t.max)}%;background:var(--green)" title="pode sair"></div></div>
    <div class="legend"><span><i style="background:#a8a497"></i>ainda vai usar: ${t.usar}</span><span><i style="background:#d6d2c5"></i>reserva: ${t.reserva}</span><span><i style="background:var(--green)"></i>pode sair: <b>${t.max}</b> de ${t.saldo} ${t.un}</span></div>
    <div class="grid g2" style="margin-top:6px;gap:0 14px">
      <div><label class="l">Quantidade (máx. ${t.max})</label><input class="f" id="tq" type="number" min="1" max="${t.max}" value="${t.sug}" oninput="trfCalc(${k})"></div>
      <div><label class="l">Transporte</label><select class="f"><option>Caminhão da construtora (hoje, 15h)</option><option>Equipe da obra destino retira</option><option>Frete terceirizado</option></select></div>
    </div>
    <div id="tcalc"></div>
    <div class="sm mut" style="margin-top:12px">Preço de custo do lote original: <b>${t.lote}</b>. Precisa do OK de <b>${t.resp}</b>; o pedido fica pendente até lá.</div>
    <div class="callout val" style="margin:16px 0 0">${icon('flask')}<div><b>Validar:</b> a reserva de "metade do que ainda vai usar" é conservadora o bastante? Ele quer ajustar por item (cimento ≠ parafuso)?</div></div>
    <div class="row" style="margin-top:22px"><span class="sp"></span><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn amb" onclick="confirmTransfer(${k})">Pedir transferência</button></div>`;
  $('modal').classList.add('on'); trfCalc(k);
}
function trfCalc(k){
  const t=TRANSF[k], q=Math.min(t.max,Math.max(0,+$('tq').value||0)), resto=Math.max(0,t.falta-q);
  $('tcalc').innerHTML = `<table class="sm" style="margin-top:16px">
    <tr><th></th><th class="num">Transferir</th><th class="num">Comprar novo</th></tr>
    <tr><td>Preço por ${t.un}</td><td class="num">${brl2(t.custo)}</td><td class="num">${brl2(t.novo)} <span class="mut">(${t.novoForn})</span></td></tr>
    <tr><td>Total de ${q} ${t.un}</td><td class="num"><b>${brl2(q*t.custo)}</b></td><td class="num">${brl2(q*t.novo)}</td></tr>
    <tr><td>Chega em</td><td class="num"><b>hoje</b></td><td class="num">${t.novoPrazo}</td></tr>
    <tr><td>No orçamento</td><td class="num" colspan="2"><span style="color:var(--red)">${NOME_OBRA[t.destino]} −${brl2(q*t.custo)}</span> · <span style="color:var(--green)">${NOME_OBRA[t.origem]} +${brl2(q*t.custo)}</span></td></tr>
    </table>${resto>0?`<div class="sm" style="margin-top:8px">Ainda faltam <b>${resto} ${t.un}</b> na ${NOME_OBRA[t.destino]}: o agente inclui no próximo pedido de compra.</div>`:''}`;
}
function confirmTransfer(k){
  const t=TRANSF[k], q=Math.min(t.max,+$('tq').value||t.sug), id='TRF-000'+(TRF_HIST.length+2);
  TRF_HIST.unshift({id, d:'28/10', inv:t.inv, qn:q, item:t.item, q:q+' '+t.un, de:t.origem, para:t.destino, v:q*t.custo, st:'Aguardando OK da origem'});
  if(t.destino==='vila-nova') LOTES.push({id, item:t.item, q:q+' '+t.un, forn:'de '+NOME_OBRA[t.origem], v:Math.round(q*t.custo), eta:'aguardando OK · chega hoje', col:2, trf:true});
  TRANSF.splice(k,1); closeModal();
  toast(`${id} pedida · ${t.resp.split(' (')[0]} foi avisada`);
  setTimeout(()=>go('estoque'),600);
}

/* Mapa de fluxos */
function renderFluxos(){
  const F=[
    ['1. Criar obra e orçar','Hub → + Nova obra → anexar projeto → descrever → budget, prazo e fases → agente levanta quantitativos e cota na região → Visão geral: "o budget é realista?" + economias',"openWizard(1)"],
    ['2. Do orçamento à compra','Componentes → comparar fornecedores (drawer) → selecionar → checkout → pedidos criados no Kanban como "Pedido feito"',"go('obra','vila-nova','componentes')"],
    ['3. Acompanhar os lotes','Kanban: Cotado → Aprovado → Pedido feito → Em trânsito → Entregue (conferir) → Disponível no inventário · atraso marcado e alimentando Prazos',"go('obra','vila-nova','kanban')"],
    ['4. Inventário (entra, sai, para onde)','Ao chegar em "Disponível" vira entrada → baixas por frente de serviço (porta principal 10%) → saldo, cobertura em dias, consumo fora do projeto',"go('obra','vila-nova','inventario')"],
    ['5. Gestão de equipe','Kanban de pessoas: vaga → mobilização → em campo → desmobilizado · custo/mês vs previsto · impacto da vaga no prazo',"go('obra','vila-nova','equipe')"],
    ['6. Prazos e riscos','Gantt planejado × real → previsão do agente → atraso por causa (fornecedor/equipe/clima) → estoque aguenta até o fim? → gerar pedidos',"go('obra','vila-nova','prazos')"],
    ['7. Estoque entre obras','Agente cruza o que sobra numa obra com o que falta em outra → máximo que pode sair = saldo − o que ainda usa − reserva → transferir a preço de custo do lote → OK do responsável da origem → entra no Kanban como transferência → acerto no budget das duas',"go('estoque')"],
    ['8. Tudo pelo chat','Home (todas as obras) ou chat da obra (sessões separadas): perguntar, receber resposta com dados + botão de ação (aprovar pedido, abrir aba, virar plano)',"go('home')"],
  ];
  return `<div class="top"><h1>Mapa de fluxos do MVP</h1></div><div class="page"><div class="grid g2">${F.map(f=>`<div class="card wscard" onclick="${f[2]}"><h3>${f[0]}</h3><div class="mut" style="line-height:1.6">${f[1]}</div><div class="link" style="margin-top:12px">abrir no protótipo ${icon('arrowRight',14)}</div></div>`).join('')}</div></div>`;
}

/* ===================== RENDER ===================== */
function render(){
  renderSide();
  const m=$('main');
  if(state.view==='hub') m.innerHTML=renderHub();
  else if(state.view==='obra' && obra()) m.innerHTML=renderObra();
  else if(state.view==='estoque') m.innerHTML=renderEstoque();
  else if(state.view==='fluxos') m.innerHTML=renderFluxos();
  else m.innerHTML=renderHome();
  m.scrollTop=0;
}
window.onhashchange();
if(!location.hash) render();
const gw=()=>$('gw').textContent=innerWidth; gw(); addEventListener('resize',gw);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDrawer();closeModal();}});
</script>
</body>
</html>
