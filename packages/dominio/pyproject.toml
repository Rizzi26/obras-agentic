[project]
name = "canteiro-dominio"
version = "0.1.0"
description = "Regras do Canteiro sem banco: conta da falta, pedidos, propostas e a porta de armazenamento portável (Mongo hoje, Firestore depois)."
requires-python = ">=3.14"
dependencies = ["pydantic>=2.11"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canteiro_dominio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
