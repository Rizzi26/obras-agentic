<!doctype html><meta charset="utf-8"><body><pre id="out">rodando</pre><script>
// rotas antigas (compatibilidade) + o esquema novo: #c/<sessao>[/t/<chave>[/<obra>]] (o /v/…[/cheia] antigo vira /t/)
const routes=['c/geral','c/geral/t/kanban/vila-nova','c/vn-aco/t/inventario','c/geral/t/aprovacoes','c/geral/v/inventario/vila-nova','c/geral/v/kanban/vila-nova/cheia','c/vn-aco/v/prazos/vila-nova','c/geral/v/aprovacoes','c/geral/v/estoque/cheia','c/lc-sobras','home','hub','estoque','fluxos','obra/vila-nova/chat','obra/vila-nova/overview','obra/vila-nova/componentes','obra/vila-nova/kanban','obra/vila-nova/inventario','obra/vila-nova/equipe','obra/vila-nova/prazos','obra/loja-centro/overview','obra/galpao/chat','campo','aprovacoes','obra/vila-nova/diario','obra/vila-nova/medicoes','obra/vila-nova','c/vn-aco/t/clima/vila-nova','c/geral/t/clima/loja-centro','c/geral/t/clima/galpao'];
// legado → visão certa (hash final esperado contém o trecho)
const compat={'home':'#c/geral','hub':'/t/hub','estoque':'/t/estoque','aprovacoes':'/t/aprovacoes','obra/vila-nova/kanban':'/t/kanban/vila-nova','obra/loja-centro/overview':'/t/overview/loja-centro','obra/vila-nova':'/t/hoje/vila-nova','c/geral/v/kanban/vila-nova/cheia':'#c/geral/t/kanban/vila-nova','c/geral/v/estoque/cheia':'#c/geral/t/estoque','fluxos':'#fluxos','campo':'#campo'};
const api=["go('obra','vila-nova','inventario'); if(state.visao.chave!=='inventario'||state.visao.obra!=='vila-nova') throw Error('go→abrirVisao')",
 "if(!document.getElementById('main').hidden||document.getElementById('visao').hidden) throw Error('uma coisa por vez: a aba de tela ocupa a área')",
 "abrirVisao('kanban','vila-nova',{filtro:'Gerdau'}); if(!document.querySelector('#visao .vs-realce')) throw Error('filtro sem destaque')",
 "telaCheia(true); if(location.hash.includes('cheia')||document.getElementById('visao').hidden) throw Error('telaCheia é no-op')",
 "if(!/\\/t\\/kanban\\/vila-nova$/.test(location.hash)||sessaoAtual().abaAtiva!=='kanban/vila-nova') throw Error('rota da aba')",
 "abrirVisao('inventario','vila-nova'); if(sessaoAtual().abas.filter(a=>a.chave==='inventario').length!==1) throw Error('aba repetida')",
 "fecharAba('inventario/vila-nova'); if(sessaoAtual().abas.some(a=>a.chave==='inventario')||state.visao) throw Error('× fecha a aba e volta à Conversa')",
 "abrirVisao('kanban','vila-nova');",
 "telaCheia(false); fecharVisao(); if(state.visao||!document.getElementById('visao').hidden) throw Error('fechar')",
 "if(!sessaoAtual().abas.some(a=>a.chave==='kanban')) throw Error('a aba fica guardada na sessão')",
 "abrirVisao('kanban','vila-nova'); abrirSessao('vn-aco'); abrirSessao('geral'); if(state.visao||!sessaoAtual().abas.some(a=>a.chave==='kanban')) throw Error('abrir a sessão: aba Conversa, abas guardadas')",
 "if(document.body.classList.contains('notes')||document.querySelector('.val:not([hidden])')&&getComputedStyle(document.querySelector('.val')).display!=='none') throw Error('notas de validação começam desligadas')",
 "if(document.querySelector('#side .nav.vs, #side select, #caEscopo')) throw Error('lateral só com conversas, sem seletor de escopo')",
 "abrirVisao('inventario','vila-nova',{filtro:'bloco'}); perguntarSobre(); if(!/Almoxarifado/.test(document.getElementById('caTxt').value)) throw Error('perguntarSobre')",
 "const id=novaSessao('vila-nova','teste'); if(!sessoes().some(s=>s.id===id)) throw Error('novaSessao')",
 "trocarEscopo(sessaoAtual().id,'loja-centro'); if(sessaoAtual().escopo!=='loja-centro') throw Error('trocarEscopo')"];
const calls=["buscarPreco('cim','vila-nova'); if(state.visao.chave!=='mercado'||!document.querySelector('#visao .mc-tab')) throw Error('buscarPreco abre a busca')",
 "const ida=mcSimularVolta('vila-nova',0); if(!ida) throw Error('ida'); mcPerguntar(ida.id); mcSim(ida.id); const n=dados('vila-nova').lotes.length; const id=mcCriarPedido(ida.id,{mcCq:'14',mcCp:'38.5',mcCr:'QB123456789BR'}); if(dados('vila-nova').lotes.length!==n+1||acharLote(id).l.col!==2) throw Error('pedido em Pedido enviado'); mcPasso(id); mcPasso(id); if(acharLote(id).l.col!==3) throw Error('rastreio move'); mcVoltaUltimo(id); mcRetomar(id); mcPasso(id); mcPasso(id); mcPasso(id); if(acharLote(id).l.col!==4||MC.tm[id]) throw Error('entregue para o timer'); if(!rastreioCard(acharLote(id).l).includes('movido por')) throw Error('rastreioCard')",
 "const b=mcSimularVolta('vila-nova',1); mcAindaNao(b.id); const c=mcSimularVolta('vila-nova',2); mcNao(c.id); mcMotivo(c.id,'frete'); mcSinalNF('PED-0162'); mcSinalMestre('PED-0162'); closeModal()",
 "const x=CV_EXT.find(e=>e.nome==='mercado'); for(const q of ['quanto custa cimento?','busca preco de areia','onde comprar telha','compara com a sinapi']){ const t=cvNorm(q); if(!x.casa(t)) throw Error('intencao: '+q); const r=x.responde(t,{id:'geral'},'vila-nova'); if(!r.length||!/Abrir Buscar pre/.test(r[0].cartoes.join(''))) throw Error('cartao: '+q); }",
 "openWizard(1)","openWizard(4)","openCheckout(['cim'])","openTransfer(0)","openComp('cim')","openInvItem('paraf')","openBaixa()","abrirVisao('clima','vila-nova')","climaRemarcar('vn-laje','2026-11-06',7)","climaDesfazer('vila-nova')","climaManter('lc-pint')","climaAtualizar('galpao')"];
const errs=[];
async function run(){
 for(const r of routes){ const f=document.createElement('iframe'); f.style.width='1440px'; f.style.height='900px'; document.body.appendChild(f);
  await new Promise(ok=>{f.onload=ok; f.src='/index.html?s='+Math.random()+'#'+r;});
  f.contentWindow.onerror=(m)=>errs.push(r+': '+m);
  await new Promise(ok=>setTimeout(ok,120));
  const txt=f.contentDocument.querySelector('#main').innerText.length+(f.contentDocument.querySelector('#visao')||{innerText:''}).innerText.length;
  if(txt<50) errs.push(r+': tela vazia');
  const h=f.contentWindow.location.hash; if(compat[r] && !h.includes(compat[r])) errs.push(r+': foi para '+h);
  if(r==='home') for(const c of api){ try{ f.contentWindow.eval(c); await new Promise(ok=>setTimeout(ok,20)); }catch(e){errs.push('API '+c.slice(0,40)+': '+e.message);} }
  if(r==='home') for(const c of calls){ try{ f.contentWindow.eval(c);}catch(e){errs.push(c+': '+e.message);} }
  f.remove(); }
 document.getElementById('out').textContent='FIM\n'+(errs.join('\n')||'sem erros');}
window.addEventListener('error',e=>errs.push('top: '+e.message));
run();
</script>
