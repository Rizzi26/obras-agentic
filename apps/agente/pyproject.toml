[project]
name = "canteiro-agente"
version = "0.1.0"
description = "Serviço do agente do Canteiro: conversa por SSE, ferramentas que chamam a API central com o token do usuário e só propõem escrita."
requires-python = ">=3.14"
dependencies = [
    "canteiro-dominio",
    "anthropic>=2.3",
    "fastapi>=0.120",
    "uvicorn>=0.38",
    "httpx>=0.28",
    "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1.2"]

[tool.uv.sources]
canteiro-dominio = { path = "../../packages/dominio", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canteiro_agente"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["modelo: chama o modelo de verdade (gasta tokens); só roda com RODAR_COM_MODELO=1"]
