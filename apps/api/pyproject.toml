[project]
name = "canteiro-api"
version = "0.1.0"
description = "API central do Canteiro: dona dos dados e das regras (FastAPI + porta de armazenamento portável)."
requires-python = ">=3.14"
dependencies = [
    "canteiro-dominio",
    "fastapi>=0.120",
    "uvicorn[standard]>=0.35",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "pymongo>=4.15",
    "argon2-cffi>=25.1",
    "pyjwt>=2.10",
    "python-multipart>=0.0.20",
    "cryptography>=46",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1.2", "httpx>=0.28", "ruff>=0.14"]

[tool.uv.sources]
canteiro-dominio = { path = "../../packages/dominio", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canteiro_api"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["canteiro_api", "canteiro_dominio"]
