# CI do Canteiro. Todo push e PR roda os testes do produto. O Render só publica a API e o agente quando estes checks
# passam (render.yaml: autoDeployTrigger: checksPass). A web na Vercel publica pela integração com o Git; o `next build`
# lá falha em erro de tipo, e este CI roda os testes antes do merge.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dominio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: testes do domínio
        working-directory: packages/dominio
        run: |
          uv venv -p 3.14 .venv
          uv pip install -p .venv -e ".[dev]"
          .venv/bin/pytest -q

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # os três idiomas da landing são gerados de modelo.html + i18n/*.json; HTML editado à mão se perde
      - name: landing gerada em dia
        run: python3 apps/site/gerar.py --conferir

  api:
    # ubuntu-latest já roda kernel 6.19+, que esta versão do mongod recusa ("Linux kernel versions 6.19 and newer has a
    # known incompatibility"). Voltar para ubuntu-latest quando a imagem do Mongo corrigir.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: MongoDB em replica set (transações)
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:8 mongod --replSet rs0 --bind_ip_all
          sleep 5
          if [ "$(docker inspect -f '{{.State.Running}}' mongo)" != "true" ]; then
            echo "::error::o mongod parou ao subir; log abaixo"; docker logs mongo 2>&1 | tail -40; exit 1
          fi
          for i in $(seq 1 30); do docker exec mongo mongosh --quiet --eval "db.runCommand({ping:1}).ok" && break; sleep 2; done
          docker exec mongo mongosh --quiet --eval "rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]})"
          for i in $(seq 1 30); do docker exec mongo mongosh --quiet --eval "rs.status().myState" | grep -q 1 && break; sleep 2; done
      - name: testes da API (memória + Mongo)
        working-directory: apps/api
        env:
          EXIGIR_MONGO: "1"
          MONGO_URL: mongodb://localhost:27017/?replicaSet=rs0&directConnection=true
        run: |
          uv venv -p 3.14 .venv
          uv pip install -p .venv -e ../../packages/dominio -e ".[dev]"
          .venv/bin/ruff check src tests
          .venv/bin/pytest -q

  agente:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: testes do agente (sem tokens; o teste com modelo real fica pulado)
        working-directory: apps/agente
        run: |
          uv venv -p 3.14 .venv
          uv pip install -p .venv -e ../../packages/dominio -e ".[dev]"
          .venv/bin/pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm tipos
      - run: pnpm test
      - name: build
        env:
          CANTEIRO_DEMO: "1"
        run: pnpm build

  imagens:
    # Garante que os Dockerfiles que o Render usa continuam compilando.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile -t canteiro-api .
      - run: docker build -f apps/agente/Dockerfile -t canteiro-agente .
